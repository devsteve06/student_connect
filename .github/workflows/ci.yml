name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No root package.json (the monorepo ships two independent npm packages), so each
# job installs and runs inside its own working directory.
defaults:
  run:
    working-directory: backend

jobs:
  backend:
    name: Backend (test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # node --test boots the app in pg-mem mode, so no DATABASE_URL is needed.
      - run: npm test

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Dummy API base: proves the build inlines the env var, but keeps CI off
      # the developer's localhost. The deployed bundle needs the real value set
      # in the Vercel project's environment variables.
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://ci.invalid
